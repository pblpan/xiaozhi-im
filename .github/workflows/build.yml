name: Build 小智IM 客户端

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 说明：本仓库根就是 xiaozhi-im，客户端代码在 client/ 子目录。
# 如果你的仓库根直接就是 client 目录，把下面 CLIENT_DIR 改成 "." 即可。
env:
  CLIENT_DIR: client
  FLUTTER_VERSION: "3.47.2"
  BASE_URL: ${{ secrets.BASE_URL || 'http://192.168.31.44:3602' }}

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build APK (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-im-android-apk
          path: ${{ env.CLIENT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.BASE_URL }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-im-windows-exe
          path: ${{ env.CLIENT_DIR }}/build/windows/x64/runner/Release/
          if-no-files-found: error

name: Build 小智IM 客户端

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 说明：本仓库根就是 xiaozhi-im，客户端代码在 client/ 子目录。
# 如果你的仓库根直接就是 client 目录，把下面 CLIENT_DIR 改成 "." 即可。

# 发布产物走 Release 附件，需要 contents: write。
# 不显式写的话，仓库「Workflow permissions」一旦被设成只读，这一步就会静默失败。
permissions:
  contents: write

env:
  CLIENT_DIR: client
  FLUTTER_VERSION: "3.47.2"
  # 产物的去处：一个**滚动 release**（每次 push 覆盖同名附件）。
  # 为什么不用 actions/upload-artifact —— 见下面 Publish 那两步的注释。
  ROLLING_TAG: ci-latest
  # ⚠️ 客户端加固后**不再兜底任何生产地址**（2026-09-16，任务 #127）。
  #    以前这里写着 `|| 'http://192.168.31.44:3602'` —— 等于把内网地址
  #    随每个安装包发出去，客户拿到手还连不上（他要连的是自己那台服务器）。
  #    留空时客户端的路径是：局域网自动发现 → 用户手填 → 管理台下发的候选地址。
  #    确实要预置的内部包：在仓库 secrets 里配 BASE_URL / WAN_URL 即可（不配就是空）。
  BASE_URL: ${{ secrets.BASE_URL }}
  WAN_URL: ${{ secrets.WAN_URL }}

jobs:
  # 最先跑：编译错误 / 测试失败不该等到打完两个包才发现。
  #
  # 🔴 为什么要单独这个 job（2026-09-25 加）：
  #    本机 Dart 起不了子进程（读命名管道被安全软件拦，报
  #    `All pipe instances are busy` / `CreateFile failed 231`），
  #    `flutter test` / `flutter analyze` 在开发机上**完全跑不了**。
  #    把测试搬到这里，等于给"改完没法验"这条路补上一个必须过的闸门。
  #    本机自检脚本：client/tools/check_win_pipe.py（退出码 0 才说明本机能构建）。
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # analyze 只让 error/warning 卡住流水线：info 级 lint 长期存在，
      # 把它算失败只会让人习惯性忽略这个 job（那才是真的失去信号）。
      - name: Analyze
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter test

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # ⚠️ 固定签名密钥（2026-09-15 修）
      # 原先 release 走 signingConfigs.debug，debug keystore 是每台构建机现场随机生成的，
      # 导致每版 CI 出的 APK 签名都不同 → 覆盖安装报 -7。这里从 secrets 还原固定 keystore。
      - name: Decode release keystore (fixed signing key)
        working-directory: ${{ env.CLIENT_DIR }}/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置 —— 拒绝产出签名不固定的安装包"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/xiaozhi-release.keystore
          if [ ! -s app/xiaozhi-release.keystore ]; then
            echo "::error::keystore 解码结果为空"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/xiaozhi-release.keystore
          storePassword=$KS_STORE_PW
          keyPassword=$KS_KEY_PW
          keyAlias=$KS_ALIAS
          storeType=PKCS12
          EOF
          echo "keystore 就绪: $(stat -c%s app/xiaozhi-release.keystore) bytes"

      - name: Build APK (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      - name: Verify APK signing cert (断言签名证书)
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "apksigner 未找到，跳过指纹打印"
          fi

      # 🔴 为什么不发 actions/upload-artifact（2026-09-25 改）
      #
      # 免费档的「Actions 产物」存储只有 **500MB**，而本仓库一轮出
      # 22MB(EXE) + 44MB(APK)、默认保留 **90 天** —— 实测 12 天堆到 139 份 /
      # 3.4GB，于是上传步骤开始报
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # 更坑的是**清空产物之后不会马上恢复**：
      #     Usage is recalculated every 6-12 hours.
      # 上一轮就是这样：产物数已经归零、构建全绿，Upload 还是红，只能干等半天。
      #
      # 改传 **Release 附件**：实测不占那 500MB 配额（产物配额明明已满，
      # 附件照样 201 传上去），而且随时能下、不受保留策略影响。
      # 标签固定 `ci-latest`，每次 `--clobber` 覆盖 —— 这里放的是
      # **构建流水线的中间产物**，正式发给用户的包在桌面目录里。
      - name: Publish APK to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
            ${CLIENT_DIR}/build/app/outputs/flutter-apk/*.apk --clobber

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      # 一个目录没法直接当附件传，先压成一个 zip（Release 附件只收文件）。
      - name: Zip Windows release dir
        shell: pwsh
        run: >
          Compress-Archive -Force
          -Path ${env:CLIENT_DIR}/build/windows/x64/runner/Release/*
          -DestinationPath xiaozhi-im-windows-exe.zip

      # 见 Android 那边 Publish 步骤上的长注释（配额 vs Release 附件）。
      - name: Publish EXE zip to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
            xiaozhi-im-windows-exe.zip --clobber

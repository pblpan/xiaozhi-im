name: Build 小智IM 客户端

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 说明：本仓库根就是 xiaozhi-im，客户端代码在 client/ 子目录。
# 如果你的仓库根直接就是 client 目录，把下面 CLIENT_DIR 改成 "." 即可。

# 发布产物走 Release 附件，需要 contents: write。
# 不显式写的话，仓库「Workflow permissions」一旦被设成只读，这一步就会静默失败。
permissions:
  contents: write

env:
  CLIENT_DIR: client
  FLUTTER_VERSION: "3.47.2"
  # 产物的去处：一个**滚动 release**（每次 push 覆盖同名附件）。
  # 为什么不用 actions/upload-artifact —— 见下面 Publish 那两步的注释。
  ROLLING_TAG: ci-latest
  # ⚠️ 客户端加固后**不再兜底任何生产地址**（2026-09-16，任务 #127）。
  #    以前这里写着 `|| 'http://192.168.31.44:3602'` —— 等于把内网地址
  #    随每个安装包发出去，客户拿到手还连不上（他要连的是自己那台服务器）。
  #    留空时客户端的路径是：局域网自动发现 → 用户手填 → 管理台下发的候选地址。
  #    确实要预置的内部包：在仓库 secrets 里配 BASE_URL / WAN_URL 即可（不配就是空）。
  BASE_URL: ${{ secrets.BASE_URL }}
  WAN_URL: ${{ secrets.WAN_URL }}
  # 签名证书指纹（secrets 里那把固定 keystore 的 SHA-256）。
  # 用途：打完 APK 后**硬断言**，指纹一变就红 —— 变了意味着这版包盖不上旧版（安装报 -7）。
  # 取自 2026-09-25 实测：0.17.0 已交付包 与 CI 新包 指纹完全一致。
  EXPECT_APK_SHA256: "64d99000e061259a94c2a54cc408487c9461cf678f7f155f488293534e0ed6d5"

jobs:
  # 最先跑：编译错误 / 测试失败不该等到打完两个包才发现。
  #
  # 🔴 为什么要单独这个 job（2026-09-25 加）：
  #    本机 Dart 起不了子进程（读命名管道被安全软件拦，报
  #    `All pipe instances are busy` / `CreateFile failed 231`），
  #    `flutter test` / `flutter analyze` 在开发机上**完全跑不了**。
  #    把测试搬到这里，等于给"改完没法验"这条路补上一个必须过的闸门。
  #    本机自检脚本：client/tools/check_win_pipe.py（退出码 0 才说明本机能构建）。
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号一致性（pubspec.yaml ↔ lib/core/app_version.dart）。
      # 🔴 为什么要卡在这里（2026-09-25 加）：这两处不一致**不会让任何东西报错**，
      #    但安装包界面会显示错的版本、"要不要升级"的比对读的也是 kAppVersion ——
      #    属于"看着没事、实际发错版"。原来只有 verify_ios.py 有一条断言，
      #    而它没有任何流程会调用（既不进 CI 也不在打包脚本里），等于没有。
      # 判据本身已在四个用例上校准过（一致 0 / 不一致 1 / 判据读不到 2 / 文件缺失 2），
      # 且"读不到"与"不一致"分开报 —— 后者是漏改，前者是判据失效，排查方向相反。
      # 放在 Setup Flutter 之前：这条只读文本，最快失败、省掉装 SDK 的时间。
      - name: 版本号一致性
        run: bash ${{ env.CLIENT_DIR }}/tools/check_version_sync.sh ${{ env.CLIENT_DIR }}

      # 管理台商档 CSV 解析（真源码，不抄副本）。
      # 🔴 为什么要卡在这里（2026-09-27 加）：这个解析器曾经只读三列、
      #    把规格/单位/价格**静默丢弃** —— 线上 12.6 万行商档「规格」「单位」
      #    全是 0%，而导入照样显示成功、不报错、不警告。
      #    后来加单位时又被测试当场抓出"千分位价格把整行切错位"。
      #    纯 node，不需要 Flutter，放在装 SDK 之前：最快失败、最省时间。
      - name: 商档解析（管理台）
        working-directory: admin
        run: node scripts/test_parse_master.cjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # analyze 只让 error/warning 卡住流水线：info 级 lint 长期存在，
      # 把它算失败只会让人习惯性忽略这个 job（那才是真的失去信号）。
      - name: Analyze
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter test

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # ⚠️ 固定签名密钥（2026-09-15 修）
      # 原先 release 走 signingConfigs.debug，debug keystore 是每台构建机现场随机生成的，
      # 导致每版 CI 出的 APK 签名都不同 → 覆盖安装报 -7。这里从 secrets 还原固定 keystore。
      - name: Decode release keystore (fixed signing key)
        working-directory: ${{ env.CLIENT_DIR }}/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置 —— 拒绝产出签名不固定的安装包"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/xiaozhi-release.keystore
          if [ ! -s app/xiaozhi-release.keystore ]; then
            echo "::error::keystore 解码结果为空"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/xiaozhi-release.keystore
          storePassword=$KS_STORE_PW
          keyPassword=$KS_KEY_PW
          keyAlias=$KS_ALIAS
          storeType=PKCS12
          EOF
          echo "keystore 就绪: $(stat -c%s app/xiaozhi-release.keystore) bytes"

      - name: Build APK (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      # 🔴 断言 APK 里**真正打进去的版本** = pubspec 写的版本。
      #
      # 为什么必须有这一步：发布用的是 `softprops/action-gh-release ... *.apk --clobber`，
      # 它是把 `app-release.apk` **原样**推上滚动 release 的，不带版本号。
      # 于是交付到桌面时给文件改名（"小智IM-Android-v0.20.0.apk"）这一步是**人手写**的。
      # 手写一个版本号太容易写成上一个版本的名字，而一个长得完全正常的包
      # **是可以装着旧版本的**。文件名和包里版本各说各话，比干脆不改名更危险 ——
      # 前者让人以为"已经升过了"。
      #
      # 判据：用 aapt2 直接读出 APK 的 versionName（Android SDK 自带，
      # runner 的 build-tools 37.0.0 里有），与 pubspec 写的比对。
      #
      # 这中间换过两次判据，两次都红了，原因都记在这儿免得再绕：
      #
      # ① `output-metadata.json` —— flutter 打包据说会顺手写一份，里头是真正
      #    打进 APK 的 versionName。**这份文件在 3.47.2 的 runner 上不存在**：
      #    build/app/outputs/flutter-apk/ 里只有 app-release.apk 和 .sha1。
      #
      # ② 在 APK 字节流里 grep `0.20.0+58` —— 也拿不到结果。
      #    版本串在 APK 内部是**拆开存**的（manifest 的字符串池 + dex 各存一段），
      #    完整串搜不到；`0.19.1+57` 的包里反而能搜到 `+58` 这种碎片，
      #    所以"搜得到"既不能证明对、也证明不了错。
      #
      # 结论：**别猜 APK 内部结构，问工具**。aapt2 是专门干这个的。
      - name: 断言 APK 版本 = pubspec 版本
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -uo pipefail
          set +e                       # 同 Verify 那步：Actions 的 -e 是命令行参数
          APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1) || true
          echo "APK: '${APK:-<没找到>}'"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi
          WANT=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '\r')
          echo "pubspec 里写的: '$WANT'"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT2=$(find "${SDK:-/nonexistent}/build-tools" -maxdepth 2 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$AAPT2" ]; then
            AAPT2=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          fi
          echo "aapt2: ${AAPT2:-<没找到>}"
          if [ -z "$AAPT2" ]; then
            echo "::error::找不到 aapt2 —— 读不出 APK 的真实版本，拒绝放行"
            echo "  SDK root: '${SDK:-<环境变量为空>}'"
            ls -1 "${SDK:-/nonexistent}/build-tools" 2>&1 | head -20
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK" 2>&1 || true)
          echo "--- aapt2 dump badging 前 5 行 ---"
          printf '%s\n' "$BADGING" | head -5
          echo "-----------------------------------"
          # 🔴 `^package:` 这个锚不能省：badging 输出里还有一行
          #    `platformBuildVersionName='13'`，名字里**含** "VersionName"，
          #    去掉锚就会被它抢走（大小写不同但 `.*` 贪婪，配合得掉）。
          #    中间用 `.*` 而不是 `[^']*` —— versionCode='58' 里带引号，
          #    `[^']*` 走不到那儿，第一版就是这么"解析不出来"的。
          GOT_NAME=$(printf '%s\n' "$BADGING" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1) || true
          GOT_CODE=$(printf '%s\n' "$BADGING" \
            | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1) || true
          # pubspec 的 `0.20.0+58` 会被 flutter **拆开**：`+` 前面进 versionName、
          # 后面进 versionCode。第三版护栏就是死在拿整串去比 versionName 上：
          # 报的是 `APK 版本 '0.20.0' 与 pubspec 的 '0.20.0+58' 不一致`。
          NAME=${WANT%%+*}
          CODE=${WANT##*+}
          echo "pubspec 拆开后 → name='$NAME' code='$CODE'"
          echo "APK 里实际的   → name='${GOT_NAME:-<解析不出来>}' code='${GOT_CODE:-<解析不出来>}'"
          if [ "$NAME" != "$GOT_NAME" ] || [ "$CODE" != "$GOT_CODE" ]; then
            echo "::error::APK 的版本号/构建号与 pubspec 的 '$WANT' 不一致 —— 拒绝交付"
            exit 1
          fi
          echo "✅ APK 版本与 pubspec 一致：$NAME+$CODE"

      # 🔴 这一步必须能**红**，而且**红的原因必须写在日志里**（2026-09-25 两次返工）
      #
      # 三种错法都踩过一遍，记在这儿免得再犯：
      #
      # ① 名叫「断言签名证书」，实际只用 apksigner **打印**一遍，工具缺失时打一句
      #    「跳过」就过去了 —— 它永远不会失败。**看着像检查，其实是装饰。**
      #
      # ② 改成真断言后第一次真跑，日志只有：
      #        APK: build/app/outputs/flutter-apk/app-release.apk
      #        ##[error]Process completed with exit code 1.
      #    中间什么都没有。原因：`X=$(a | b | c)` 里管道有一环失败（glob 没匹配上），
      #    赋值语句被 `-e` 带走，而 stderr 还写着 2>/dev/null。
      #    →「工具没找到」和「指纹不一致」变成同一种红。
      #
      # ③ **第二版修了一半**：以为 `set -uo pipefail` 就去掉了 `-e`。
      #    错 —— **GitHub Actions 是用 `bash -e {0}` 调脚本的，`-e` 是命令行参数，
      #    脚本里 `set -u` 覆盖不掉它**，必须显式 `set +e`。
      #    而且本地自测时跑的是 `bash script.sh`（没有 -e），**测试环境和线上不一致**，
      #    所以四个分支本地全绿、线上照样静默死。
      #
      # 现在的写法：
      #   · `set +e` 显式关掉外层 -e：本步每条路径都必须**显式 exit**，不留静默死的分支；
      #   · 每个 `$( )` 捕获都带 `|| true`，双保险；
      #   · apksigner 三级兜底查找，每级都打印；
      #   · 失败时把 SDK 路径、build-tools 目录内容、apksigner 原始输出全打出来。
      - name: Verify APK signing cert (断言签名证书)
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -uo pipefail
          set +e                       # 🔴 见上面 ③：Actions 的 -e 是命令行参数，覆盖不掉
          APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1) || true
          echo "APK: ${APK:-<没找到>}"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK root: '${SDK:-<环境变量为空>}'"

          APKSIGNER=""
          if [ -n "$SDK" ]; then
            APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name 'apksigner*' 2>/dev/null | sort -V | tail -1) || true
          fi
          [ -n "$APKSIGNER" ] || APKSIGNER=$(command -v apksigner 2>/dev/null || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'apksigner' 2>/dev/null | sort -V | tail -1) || true
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner —— 无法断言签名，拒绝放行"
            echo "  build-tools 目录：${SDK:-<空>}/build-tools"
            ls -1 "${SDK:-/nonexistent}/build-tools" 2>&1 | head -20
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "--- apksigner verify --print-certs 输出 ---"
          printf '%s\n' "$RAW" | head -20
          echo "-----------------------------------------"

          # ⚠️ 匹配串**不能带「Signer #1」前缀**（2026-09-25 线上实测）：
          #    旧版 apksigner 打的是 `Signer #1 certificate SHA-256 digest: ...`，
          #    而 build-tools 37 的 apksigner 改成了 `V2 Signer: certificate SHA-256 digest: ...`，
          #    锚死前者就一条也匹配不到 → 静默 exit 1。
          #    只锚 `certificate SHA-256 digest`（两种格式都含），前缀是什么都不管。
          DIGEST=$(printf '%s\n' "$RAW" \
            | grep -F 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' \
            | tr -d ':' | tr 'A-Z' 'a-z') || true
          if [ -z "$DIGEST" ]; then
            echo "::error::解析不出签名指纹（APK 可能没签名，或 apksigner 输出格式又变了）"
            exit 1
          fi
          echo "实际 SHA-256: $DIGEST"
          echo "期望 SHA-256: $EXPECT_APK_SHA256"
          if [ "$DIGEST" != "$EXPECT_APK_SHA256" ]; then
            echo "::error::签名指纹与已交付版本不一致 —— 这版 APK 装不到旧版上（报 -7），不许交付"
            exit 1
          fi
          echo "✅ 签名断言通过：与已交付版本同源（$DIGEST），可覆盖安装"
          exit 0

      # 🔴 为什么不发 actions/upload-artifact（2026-09-25 改）
      #
      # 免费档的「Actions 产物」存储只有 **500MB**，而本仓库一轮出
      # 22MB(EXE) + 44MB(APK)、默认保留 **90 天** —— 实测 12 天堆到 139 份 /
      # 3.4GB，于是上传步骤开始报
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # 更坑的是**清空产物之后不会马上恢复**：
      #     Usage is recalculated every 6-12 hours.
      # 上一轮就是这样：产物数已经归零、构建全绿，Upload 还是红，只能干等半天。
      #
      # 改传 **Release 附件**：实测不占那 500MB 配额（产物配额明明已满，
      # 附件照样 201 传上去），而且随时能下、不受保留策略影响。
      # 标签固定 `ci-latest`，每次 `--clobber` 覆盖 —— 这里放的是
      # **构建流水线的中间产物**，正式发给用户的包在桌面目录里。
      - name: Publish APK to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          # 🔴 上传的文件名**由机器拼**（`小智IM-Android-v<pubspec 版本>.apk`），
          #    不留给"下载下来再改名"。改名这一步是纯手工的，手滑写成上一个版本的
          #    名字，一个长得完全正常的包就装着旧版本 —— 而且桌面现在就有一个
          #    这样的包：叫「小智IM-Android-v0.19.1.apk」，里面却搜不到 0.20.0。
          WANT=$(sed -n 's/^version:[[:space:]]*//p' "${CLIENT_DIR}/pubspec.yaml" | head -1 | tr -d '\r')
          OUTDIR="${CLIENT_DIR}/build/app/outputs/flutter-apk"
          OUT="${OUTDIR}/xiaozhi-im-Android-${WANT}.apk"
          cp "${OUTDIR}/app-release.apk" "$OUT"
          echo "发布文件名: $(basename "$OUT")"
          echo "发布文件 sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      # 一个目录没法直接当附件传，先压成一个 zip（Release 附件只收文件）。
      - name: Zip Windows release dir
        shell: pwsh
        run: >
          Compress-Archive -Force
          -Path ${env:CLIENT_DIR}/build/windows/x64/runner/Release/*
          -DestinationPath xiaozhi-im-windows-exe.zip

      # 见 Android 那边 Publish 步骤上的长注释（配额 vs Release 附件）。
      - name: Publish EXE zip to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          # 同 Android 那侧：文件名由机器拼上版本号，不留给人手写。
          # Windows 侧没有 aapt2 可问版本（exe 的版本资源要读 PE），所以这里
          # **不假装验版本** —— 只保证"名字里那个版本是 pubspec 的，不是我敲的"。
          WANT=$(sed -n 's/^version:[[:space:]]*//p' "${CLIENT_DIR}/pubspec.yaml" | head -1 | tr -d '\r')
          OUT="xiaozhi-im-windows-${WANT}.zip"
          mv xiaozhi-im-windows-exe.zip "$OUT"
          echo "发布文件名: $OUT"
          echo "发布文件 sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

name: Build 小智IM 客户端

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 说明：本仓库根就是 xiaozhi-im，客户端代码在 client/ 子目录。
# 如果你的仓库根直接就是 client 目录，把下面 CLIENT_DIR 改成 "." 即可。
env:
  CLIENT_DIR: client
  FLUTTER_VERSION: "3.47.2"
  # ⚠️ 客户端加固后**不再兜底任何生产地址**（2026-09-16，任务 #127）。
  #    以前这里写着 `|| 'http://192.168.31.44:3602'` —— 等于把内网地址
  #    随每个安装包发出去，客户拿到手还连不上（他要连的是自己那台服务器）。
  #    留空时客户端的路径是：局域网自动发现 → 用户手填 → 管理台下发的候选地址。
  #    确实要预置的内部包：在仓库 secrets 里配 BASE_URL / WAN_URL 即可（不配就是空）。
  BASE_URL: ${{ secrets.BASE_URL }}
  WAN_URL: ${{ secrets.WAN_URL }}

jobs:
  # 最先跑：编译错误 / 测试失败不该等到打完两个包才发现。
  #
  # 🔴 为什么要单独这个 job（2026-09-25 加）：
  #    本机 Dart 起不了子进程（读命名管道被安全软件拦，报
  #    `All pipe instances are busy` / `CreateFile failed 231`），
  #    `flutter test` / `flutter analyze` 在开发机上**完全跑不了**。
  #    把测试搬到这里，等于给"改完没法验"这条路补上一个必须过的闸门。
  #    本机自检脚本：client/tools/check_win_pipe.py（退出码 0 才说明本机能构建）。
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # 🔴 为什么要在这里清旧产物（2026-09-25 加）
      #    免费档的 Actions 产物存储只有 500MB，而本仓库一轮出
      #    22MB(EXE) + 44MB(APK)，默认保留 **90 天** —— 实测 12 天堆到
      #    139 份 / 3.4GB，于是两个上传步骤双双报
      #        Failed to CreateArtifact: Artifact storage quota has been hit.
      #    最坑的是**构建本身是成功的**：日志里 `Build APK (release)` 是绿的，
      #    只有最后一步 Upload 红，很容易被误读成"编译挂了"去改代码。
      #    兜底：每次跑之前删掉 6 小时前的旧产物（远大于本轮构建时长，
      #    不会误删同一轮正在上传的包）。这步失败不影响流水线 ——
      #    它只是个配额清理，不该让一个能成功的构建变红。
      - name: Purge stale artifacts (quota guard)
        if: github.event_name != 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          rows = subprocess.run(
              ['gh', 'api', '--paginate', 'repos/%s/actions/artifacts' % repo,
               '--jq', '.artifacts[] | "\(.id) \(.created_at)"'],
              capture_output=True, text=True).stdout
          now = dt.datetime.now(dt.timezone.utc)
          gone = 0
          for line in rows.split('\n'):
              if not line.strip():
                  continue
              aid, ts = line.split()
              born = dt.datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ').replace(
                  tzinfo=dt.timezone.utc)
              if (now - born).total_seconds() > 6 * 3600:
                  subprocess.run(['gh', 'api', '-X', 'DELETE',
                                  'repos/%s/actions/artifacts/%s' % (repo, aid)])
                  gone += 1
          print('清掉 %d 个 6 小时前的旧产物' % gone)
          PY

      # analyze 只让 error/warning 卡住流水线：info 级 lint 长期存在，
      # 把它算失败只会让人习惯性忽略这个 job（那才是真的失去信号）。
      - name: Analyze
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter test

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # ⚠️ 固定签名密钥（2026-09-15 修）
      # 原先 release 走 signingConfigs.debug，debug keystore 是每台构建机现场随机生成的，
      # 导致每版 CI 出的 APK 签名都不同 → 覆盖安装报 -7。这里从 secrets 还原固定 keystore。
      - name: Decode release keystore (fixed signing key)
        working-directory: ${{ env.CLIENT_DIR }}/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置 —— 拒绝产出签名不固定的安装包"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/xiaozhi-release.keystore
          if [ ! -s app/xiaozhi-release.keystore ]; then
            echo "::error::keystore 解码结果为空"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/xiaozhi-release.keystore
          storePassword=$KS_STORE_PW
          keyPassword=$KS_KEY_PW
          keyAlias=$KS_ALIAS
          storeType=PKCS12
          EOF
          echo "keystore 就绪: $(stat -c%s app/xiaozhi-release.keystore) bytes"

      - name: Build APK (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      - name: Verify APK signing cert (断言签名证书)
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "apksigner 未找到，跳过指纹打印"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-im-android-apk
          path: ${{ env.CLIENT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          # 默认 90 天 —— 一个 44MB 的 APK 留 90 天等于把 500MB 配额
          # 三天就吃光（见上面 Purge 那步的说明）。留 1 天，够下载。
          retention-days: 1

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-im-windows-exe
          path: ${{ env.CLIENT_DIR }}/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 1

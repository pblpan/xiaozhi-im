name: Build 小智IM 客户端

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 说明：本仓库根就是 xiaozhi-im，客户端代码在 client/ 子目录。
# 如果你的仓库根直接就是 client 目录，把下面 CLIENT_DIR 改成 "." 即可。

# 发布产物走 Release 附件，需要 contents: write。
# 不显式写的话，仓库「Workflow permissions」一旦被设成只读，这一步就会静默失败。
permissions:
  contents: write

env:
  CLIENT_DIR: client
  FLUTTER_VERSION: "3.47.2"
  # 产物的去处：一个**滚动 release**（每次 push 覆盖同名附件）。
  # 为什么不用 actions/upload-artifact —— 见下面 Publish 那两步的注释。
  ROLLING_TAG: ci-latest
  # ⚠️ 客户端加固后**不再兜底任何生产地址**（2026-09-16，任务 #127）。
  #    以前这里写着 `|| 'http://192.168.31.44:3602'` —— 等于把内网地址
  #    随每个安装包发出去，客户拿到手还连不上（他要连的是自己那台服务器）。
  #    留空时客户端的路径是：局域网自动发现 → 用户手填 → 管理台下发的候选地址。
  #    确实要预置的内部包：在仓库 secrets 里配 BASE_URL / WAN_URL 即可（不配就是空）。
  BASE_URL: ${{ secrets.BASE_URL }}
  WAN_URL: ${{ secrets.WAN_URL }}
  # 签名证书指纹（secrets 里那把固定 keystore 的 SHA-256）。
  # 用途：打完 APK 后**硬断言**，指纹一变就红 —— 变了意味着这版包盖不上旧版（安装报 -7）。
  # 取自 2026-09-25 实测：0.17.0 已交付包 与 CI 新包 指纹完全一致。
  EXPECT_APK_SHA256: "64d99000e061259a94c2a54cc408487c9461cf678f7f155f488293534e0ed6d5"

  # ── hyd 版（好又多版）扫码枪的内置商档 ────────────────────────────
  # 🔴 为什么 CI 要"下载"商档，而不是它就在仓库里（2026-10-03）
  #   `scanner_app/.gitignore` 明确排除了 `android/app/src/hyd/assets/builtin_master.csv`
  #   —— 那是**门店数据**，本仓库的规矩是"凭据与门店数据一律不入库"。
  #   而它的源表（微信临时目录里的 `商品信息.txt`）**已被微信清掉**，
  #   重跑 scanner_app/tools/build_builtin_master.py 也生成不出来。
  #   → CI 上没有任何途径拿到这份档案。
  #
  #   不解决就直接出**哑包**：APK 装得上、扫得动，但点"恢复内置档案"报
  #   「这个版本没有内置商品档案」，现场表现是"扫什么都显示未知商品"，
  #   而且**从 APK 大小完全看不出来**（见下面 MIN 那个变量的注释）。
  #
  #   所以走 release 附件：私有仓库的 release 与仓库同一道访问门（不扩大暴露面），
  #   不进 git 历史（git 一旦入库就洗不干净，且会被每个人 clone 走），
  #   门店换档时重传附件即可、不用改代码也不用 force push。
  #   上传脚本在工作区根：_ci_hyd_master.py
  HYD_MASTER_TAG: hyd-master-data
  HYD_MASTER_ASSET: builtin_master.csv
  # 钉死构建时该用哪一份。传错版本/传了半截文件都靠它红。
  EXPECT_HYD_MASTER_SHA256: "c9189e2ec2cc66f1a98bef71a45cb5d49eaafb4468fc699ef79353bd80263df7"
  # 打完包后断言"APK 里真的有这份档案，且体积对得上"。
  # 🔴 下限为什么卡 5MB：gradle 放错资源目录**不报错也不打包**
  #    （scanner_app/tools/build_builtin_master.py 顶部记着这个坑：
  #     "2026-09-19 就踩了这个：APK 只大了 16KB"）。
  #    也就是说**少了这份档案的包一样能构建成功、签名也过、版本也对**，
  #    唯一能认出它的办法就是量体积 —— 5MB 是 6.97MB 的安全下界，
  #    留出余量又不会被"刚好少一大截"骗过去。
  MIN_HYD_MASTER_BYTES: 5242880

jobs:
  # 最先跑：编译错误 / 测试失败不该等到打完两个包才发现。
  #
  # 🔴 为什么要单独这个 job（2026-09-25 加）：
  #    本机 Dart 起不了子进程（读命名管道被安全软件拦，报
  #    `All pipe instances are busy` / `CreateFile failed 231`），
  #    `flutter test` / `flutter analyze` 在开发机上**完全跑不了**。
  #    把测试搬到这里，等于给"改完没法验"这条路补上一个必须过的闸门。
  #    本机自检脚本：client/tools/check_win_pipe.py（退出码 0 才说明本机能构建）。
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号一致性（pubspec.yaml ↔ lib/core/app_version.dart）。
      # 🔴 为什么要卡在这里（2026-09-25 加）：这两处不一致**不会让任何东西报错**，
      #    但安装包界面会显示错的版本、"要不要升级"的比对读的也是 kAppVersion ——
      #    属于"看着没事、实际发错版"。原来只有 verify_ios.py 有一条断言，
      #    而它没有任何流程会调用（既不进 CI 也不在打包脚本里），等于没有。
      # 判据本身已在四个用例上校准过（一致 0 / 不一致 1 / 判据读不到 2 / 文件缺失 2），
      # 且"读不到"与"不一致"分开报 —— 后者是漏改，前者是判据失效，排查方向相反。
      # 放在 Setup Flutter 之前：这条只读文本，最快失败、省掉装 SDK 的时间。
      - name: 版本号一致性
        run: bash ${{ env.CLIENT_DIR }}/tools/check_version_sync.sh ${{ env.CLIENT_DIR }}

      # 管理台商档 CSV 解析（真源码，不抄副本）。
      # 🔴 为什么要卡在这里（2026-09-27 加）：这个解析器曾经只读三列、
      #    把规格/单位/价格**静默丢弃** —— 线上 12.6 万行商档「规格」「单位」
      #    全是 0%，而导入照样显示成功、不报错、不警告。
      #    后来加单位时又被测试当场抓出"千分位价格把整行切错位"。
      #    纯 node，不需要 Flutter，放在装 SDK 之前：最快失败、最省时间。
      - name: 商档解析（管理台）
        working-directory: admin
        run: node scripts/test_parse_master.cjs

      # ---------------------------------------------------------------
      # 服务端回归（2026-10-03 加，审计 P0）
      #
      # 🔴 为什么要补这一步
      #   以前 test 闸门**只跑客户端的 flutter test**，服务端那 30 多个 e2e
      #   一个都没跑过。它们只能靠人记着手动 `node server/test/xxx_e2e.js`。
      #   后果不是"覆盖率低"，而是**改坏了没人知道** —— 审计就是在这时候
      #   查出 4 处多步写入没有事务（能留下半成品脏数据）、登录接口无限流
      #   （可爆破 + scryptSync 阻塞事件循环）却一直没人碰过。
      #   测试写得再好，不跑等于没有。这一步把它变成**闸门**。
      #
      # 为什么排在 Flutter 相关步骤**之前**：
      #   服务端测试只要 node，几分钟就跑完；装 Flutter SDK 慢得多。
      #   服务端挂了就没必要再花时间装 SDK 打包了。
      #
      # 为什么显式钉 Node 22：
      #   服务端用了 `node:sqlite`（DatabaseSync），**Node 22 才有**。
      #   不钉版本的话，runner 哪天换了默认版本就会整体起不来，
      #   而报错会是"Cannot find module 'node:sqlite'"这种看着像代码坏了的信息。
      - name: Setup Node 22（服务端 sqlite 需要）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🔴 2026-10-03：这一步是**补漏**，第一版闸门漏了它，CI 直接红。
      #   症状是一屏 "Cannot find module 'express' / 'jsonwebtoken' / 'ws'"，
      #   每个 e2e 都在 "服务端启动超时" —— 看着像代码坏了，其实是**依赖没装**。
      #   为什么本机发现不了：本机 server/node_modules 早就装好了，本地跑全绿；
      #   而 CI runner 是干净环境，没有 node_modules。
      #   这就是"本地绿 ≠ CI 绿"的典型案例，也正是加这道闸门的意义。
      - name: 安装服务端依赖
        working-directory: server
        run: npm ci --no-audit --no-fund

      # 变异测试（*_mutation.js）默认不跑：它会**临时把源码改成坏的**再还原，
      # 用来验证"测试能不能抓出这个错"。要跑时把下面这行的 if 去掉即可。
      # bash test/run_all.sh 是统一入口（server/test/run_all.sh 顶部有说明）：
      #   · 串行而非并行 —— 这些测试占的是硬编码端口且大量重号，并行必然互相抢端口；
      #   · 只看退出码不看日志里的 ✓ —— 有的脚本失败时仍会打印一堆 ✓。
      - name: 服务端回归（30+ e2e）
        working-directory: server
        run: bash test/run_all.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # analyze 只让 error/warning 卡住流水线：info 级 lint 长期存在，
      # 把它算失败只会让人习惯性忽略这个 job（那才是真的失去信号）。
      - name: Analyze
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter test

      # ---------------------------------------------------------------
      # 扫码枪（scanner_app）也要过闸门（2026-10-03 加）
      #
      # 🔴 为什么要单独跑，而不是"它简单应该没事"
      #   它**从来没在这道闸门里出现过** —— 之前 0.19.x~0.22.0 几十次 push，
      #   scanner_app 的代码一行都没被 analyze/test 过，改坏了没人知道。
      #   它的 test 里正好钉着一批"坏了也不报错"的东西（GBK 表下标错一格、
      #   表头别名没认出、`="..."` 没剥），是最需要闸门的那类。
      #
      # 它的 pubspec 依赖 sqlite3 ^3.6.0 + hooks。在 Linux runner 上
      # hooks 会走 `default: sqlite3`（预编译库下载）—— CI 网络通得过；
      # 真跑不起来时这里的报错是 "Building assets for package:sqlite3 failed"，
      # 与"代码写错了"是两回事，别顺着代码方向排查。
      - name: 扫码枪 Pub get
        working-directory: scanner_app
        run: flutter pub get

      - name: 扫码枪 Analyze
        working-directory: scanner_app
        run: flutter analyze --no-fatal-infos

      - name: 扫码枪 Test
        working-directory: scanner_app
        run: flutter test

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      # ⚠️ 固定签名密钥（2026-09-15 修）
      # 原先 release 走 signingConfigs.debug，debug keystore 是每台构建机现场随机生成的，
      # 导致每版 CI 出的 APK 签名都不同 → 覆盖安装报 -7。这里从 secrets 还原固定 keystore。
      - name: Decode release keystore (fixed signing key)
        working-directory: ${{ env.CLIENT_DIR }}/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置 —— 拒绝产出签名不固定的安装包"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/xiaozhi-release.keystore
          if [ ! -s app/xiaozhi-release.keystore ]; then
            echo "::error::keystore 解码结果为空"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/xiaozhi-release.keystore
          storePassword=$KS_STORE_PW
          keyPassword=$KS_KEY_PW
          keyAlias=$KS_ALIAS
          storeType=PKCS12
          EOF
          echo "keystore 就绪: $(stat -c%s app/xiaozhi-release.keystore) bytes"

      - name: Build APK (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build apk --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      # 🔴 断言 APK 里**真正打进去的版本** = pubspec 写的版本。
      #
      # 为什么必须有这一步：发布用的是 `softprops/action-gh-release ... *.apk --clobber`，
      # 它是把 `app-release.apk` **原样**推上滚动 release 的，不带版本号。
      # 于是交付到桌面时给文件改名（"小智IM-Android-v0.20.0.apk"）这一步是**人手写**的。
      # 手写一个版本号太容易写成上一个版本的名字，而一个长得完全正常的包
      # **是可以装着旧版本的**。文件名和包里版本各说各话，比干脆不改名更危险 ——
      # 前者让人以为"已经升过了"。
      #
      # 判据：用 aapt2 直接读出 APK 的 versionName（Android SDK 自带，
      # runner 的 build-tools 37.0.0 里有），与 pubspec 写的比对。
      #
      # 这中间换过两次判据，两次都红了，原因都记在这儿免得再绕：
      #
      # ① `output-metadata.json` —— flutter 打包据说会顺手写一份，里头是真正
      #    打进 APK 的 versionName。**这份文件在 3.47.2 的 runner 上不存在**：
      #    build/app/outputs/flutter-apk/ 里只有 app-release.apk 和 .sha1。
      #
      # ② 在 APK 字节流里 grep `0.20.0+58` —— 也拿不到结果。
      #    版本串在 APK 内部是**拆开存**的（manifest 的字符串池 + dex 各存一段），
      #    完整串搜不到；`0.19.1+57` 的包里反而能搜到 `+58` 这种碎片，
      #    所以"搜得到"既不能证明对、也证明不了错。
      #
      # 结论：**别猜 APK 内部结构，问工具**。aapt2 是专门干这个的。
      - name: 断言 APK 版本 = pubspec 版本
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -uo pipefail
          set +e                       # 同 Verify 那步：Actions 的 -e 是命令行参数
          APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1) || true
          echo "APK: '${APK:-<没找到>}'"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi
          WANT=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '\r')
          echo "pubspec 里写的: '$WANT'"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT2=$(find "${SDK:-/nonexistent}/build-tools" -maxdepth 2 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$AAPT2" ]; then
            AAPT2=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          fi
          echo "aapt2: ${AAPT2:-<没找到>}"
          if [ -z "$AAPT2" ]; then
            echo "::error::找不到 aapt2 —— 读不出 APK 的真实版本，拒绝放行"
            echo "  SDK root: '${SDK:-<环境变量为空>}'"
            ls -1 "${SDK:-/nonexistent}/build-tools" 2>&1 | head -20
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK" 2>&1 || true)
          echo "--- aapt2 dump badging 前 5 行 ---"
          printf '%s\n' "$BADGING" | head -5
          echo "-----------------------------------"
          # 🔴 `^package:` 这个锚不能省：badging 输出里还有一行
          #    `platformBuildVersionName='13'`，名字里**含** "VersionName"，
          #    去掉锚就会被它抢走（大小写不同但 `.*` 贪婪，配合得掉）。
          #    中间用 `.*` 而不是 `[^']*` —— versionCode='58' 里带引号，
          #    `[^']*` 走不到那儿，第一版就是这么"解析不出来"的。
          GOT_NAME=$(printf '%s\n' "$BADGING" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1) || true
          GOT_CODE=$(printf '%s\n' "$BADGING" \
            | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1) || true
          # pubspec 的 `0.20.0+58` 会被 flutter **拆开**：`+` 前面进 versionName、
          # 后面进 versionCode。第三版护栏就是死在拿整串去比 versionName 上：
          # 报的是 `APK 版本 '0.20.0' 与 pubspec 的 '0.20.0+58' 不一致`。
          NAME=${WANT%%+*}
          CODE=${WANT##*+}
          echo "pubspec 拆开后 → name='$NAME' code='$CODE'"
          echo "APK 里实际的   → name='${GOT_NAME:-<解析不出来>}' code='${GOT_CODE:-<解析不出来>}'"
          if [ "$NAME" != "$GOT_NAME" ] || [ "$CODE" != "$GOT_CODE" ]; then
            echo "::error::APK 的版本号/构建号与 pubspec 的 '$WANT' 不一致 —— 拒绝交付"
            exit 1
          fi
          echo "✅ APK 版本与 pubspec 一致：$NAME+$CODE"

      # 🔴 这一步必须能**红**，而且**红的原因必须写在日志里**（2026-09-25 两次返工）
      #
      # 三种错法都踩过一遍，记在这儿免得再犯：
      #
      # ① 名叫「断言签名证书」，实际只用 apksigner **打印**一遍，工具缺失时打一句
      #    「跳过」就过去了 —— 它永远不会失败。**看着像检查，其实是装饰。**
      #
      # ② 改成真断言后第一次真跑，日志只有：
      #        APK: build/app/outputs/flutter-apk/app-release.apk
      #        ##[error]Process completed with exit code 1.
      #    中间什么都没有。原因：`X=$(a | b | c)` 里管道有一环失败（glob 没匹配上），
      #    赋值语句被 `-e` 带走，而 stderr 还写着 2>/dev/null。
      #    →「工具没找到」和「指纹不一致」变成同一种红。
      #
      # ③ **第二版修了一半**：以为 `set -uo pipefail` 就去掉了 `-e`。
      #    错 —— **GitHub Actions 是用 `bash -e {0}` 调脚本的，`-e` 是命令行参数，
      #    脚本里 `set -u` 覆盖不掉它**，必须显式 `set +e`。
      #    而且本地自测时跑的是 `bash script.sh`（没有 -e），**测试环境和线上不一致**，
      #    所以四个分支本地全绿、线上照样静默死。
      #
      # 现在的写法：
      #   · `set +e` 显式关掉外层 -e：本步每条路径都必须**显式 exit**，不留静默死的分支；
      #   · 每个 `$( )` 捕获都带 `|| true`，双保险；
      #   · apksigner 三级兜底查找，每级都打印；
      #   · 失败时把 SDK 路径、build-tools 目录内容、apksigner 原始输出全打出来。
      - name: Verify APK signing cert (断言签名证书)
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -uo pipefail
          set +e                       # 🔴 见上面 ③：Actions 的 -e 是命令行参数，覆盖不掉
          APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1) || true
          echo "APK: ${APK:-<没找到>}"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK root: '${SDK:-<环境变量为空>}'"

          APKSIGNER=""
          if [ -n "$SDK" ]; then
            APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name 'apksigner*' 2>/dev/null | sort -V | tail -1) || true
          fi
          [ -n "$APKSIGNER" ] || APKSIGNER=$(command -v apksigner 2>/dev/null || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'apksigner' 2>/dev/null | sort -V | tail -1) || true
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner —— 无法断言签名，拒绝放行"
            echo "  build-tools 目录：${SDK:-<空>}/build-tools"
            ls -1 "${SDK:-/nonexistent}/build-tools" 2>&1 | head -20
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "--- apksigner verify --print-certs 输出 ---"
          printf '%s\n' "$RAW" | head -20
          echo "-----------------------------------------"

          # ⚠️ 匹配串**不能带「Signer #1」前缀**（2026-09-25 线上实测）：
          #    旧版 apksigner 打的是 `Signer #1 certificate SHA-256 digest: ...`，
          #    而 build-tools 37 的 apksigner 改成了 `V2 Signer: certificate SHA-256 digest: ...`，
          #    锚死前者就一条也匹配不到 → 静默 exit 1。
          #    只锚 `certificate SHA-256 digest`（两种格式都含），前缀是什么都不管。
          DIGEST=$(printf '%s\n' "$RAW" \
            | grep -F 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' \
            | tr -d ':' | tr 'A-Z' 'a-z') || true
          if [ -z "$DIGEST" ]; then
            echo "::error::解析不出签名指纹（APK 可能没签名，或 apksigner 输出格式又变了）"
            exit 1
          fi
          echo "实际 SHA-256: $DIGEST"
          echo "期望 SHA-256: $EXPECT_APK_SHA256"
          if [ "$DIGEST" != "$EXPECT_APK_SHA256" ]; then
            echo "::error::签名指纹与已交付版本不一致 —— 这版 APK 装不到旧版上（报 -7），不许交付"
            exit 1
          fi
          echo "✅ 签名断言通过：与已交付版本同源（$DIGEST），可覆盖安装"
          exit 0

      # 🔴 为什么不发 actions/upload-artifact（2026-09-25 改）
      #
      # 免费档的「Actions 产物」存储只有 **500MB**，而本仓库一轮出
      # 22MB(EXE) + 44MB(APK)、默认保留 **90 天** —— 实测 12 天堆到 139 份 /
      # 3.4GB，于是上传步骤开始报
      #     Failed to CreateArtifact: Artifact storage quota has been hit.
      # 更坑的是**清空产物之后不会马上恢复**：
      #     Usage is recalculated every 6-12 hours.
      # 上一轮就是这样：产物数已经归零、构建全绿，Upload 还是红，只能干等半天。
      #
      # 改传 **Release 附件**：实测不占那 500MB 配额（产物配额明明已满，
      # 附件照样 201 传上去），而且随时能下、不受保留策略影响。
      # 标签固定 `ci-latest`，每次 `--clobber` 覆盖 —— 这里放的是
      # **构建流水线的中间产物**，正式发给用户的包在桌面目录里。
      - name: Publish APK to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          # 🔴 上传的文件名**由机器拼**（`小智IM-Android-v<pubspec 版本>.apk`），
          #    不留给"下载下来再改名"。改名这一步是纯手工的，手滑写成上一个版本的
          #    名字，一个长得完全正常的包就装着旧版本 —— 而且桌面现在就有一个
          #    这样的包：叫「小智IM-Android-v0.19.1.apk」，里面却搜不到 0.20.0。
          WANT=$(sed -n 's/^version:[[:space:]]*//p' "${CLIENT_DIR}/pubspec.yaml" | head -1 | tr -d '\r')
          OUTDIR="${CLIENT_DIR}/build/app/outputs/flutter-apk"
          OUT="${OUTDIR}/xiaozhi-im-Android-${WANT}.apk"
          cp "${OUTDIR}/app-release.apk" "$OUT"
          echo "发布文件名: $(basename "$OUT")"
          echo "发布文件 sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

  # ── 好又多版扫码枪（scanner_app 的 hyd flavor）────────────────────
  #
  # 只出 hyd 版，不出 std：好又多版才是要交付的那一个（带内置商档），
  # 通用版没有内置档案、客户那边用不上，不产。
  build-scanner-hyd:
    name: Scanner 好又多版 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: scanner_app
        run: flutter pub get

      # ---------------------------------------------------------------
      # 取内置商档 —— 这一步是"别出哑包"的根（2026-10-03）
      #
      # 放在 pub get 之后、构建之前：它是构建的**输入**，缺了就不该往下走，
      # 早失败省时间。
      #
      # 三道判据，缺一不可：
      #   ① 下载成功且非空（GitHub 上少了/改名了附件）
      #   ② sha256 等于 env 里钉死的那份（传错了版本、或传了半截文件）
      #   ③ 行数量级对得上（12 万行级别；不是 12 万字节）
      # 只做 ① 的话，"传了个空壳文件"照样能过 —— 而空壳打进包里，
      # 现场是"扫什么都未知商品"，从 APK 体积上完全看不出来。
      - name: 下载内置商档
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DST="scanner_app/android/app/src/hyd/assets/${HYD_MASTER_ASSET}"
          mkdir -p "$(dirname "$DST")"

          gh release download "$HYD_MASTER_TAG" -R "$GITHUB_REPOSITORY" \
             --pattern "$HYD_MASTER_ASSET" --dir "$(dirname "$DST")" --clobber

          if [ ! -s "$DST" ]; then
            echo "::error::商档没下载下来或为空：$DST"
            exit 1
          fi
          echo "已下载：$(stat -c%s "$DST") 字节"

          GOT=$(sha256sum "$DST" | cut -d' ' -f1)
          echo "实际 sha256: $GOT"
          echo "期望 sha256: $EXPECT_HYD_MASTER_SHA256"
          if [ "$GOT" != "$EXPECT_HYD_MASTER_SHA256" ]; then
            echo "::error::商档指纹与 env 里钉的不一致 —— 拒绝用未知来源的门店数据出包"
            exit 1
          fi

          # 行数量级：12 万行级别。低于 1000 行基本等于"传了个表头"。
          ROWS=$(wc -l < "$DST")
          echo "行数: $ROWS"
          if [ "$ROWS" -lt 1000 ]; then
            echo "::error::商档只有 $ROWS 行，明显不完整（正常 12 万+ 行）"
            exit 1
          fi
          echo "✅ 商档校验通过（指纹 + 行数）"

      # 固定签名密钥：与主客户端同一把，否则 hyd 版装不上旧版（报 -7）。
      - name: Decode release keystore (fixed signing key)
        working-directory: scanner_app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置 —— 拒绝产出签名不固定的安装包"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > app/xiaozhi-release.keystore
          if [ ! -s app/xiaozhi-release.keystore ]; then
            echo "::error::keystore 解码结果为空"
            exit 1
          fi
          # ⚠️ 路径必须是 android/key.properties（不是 android/app/…）：
          #    build.gradle.kts 里读的是 rootProject.file("key.properties")，
          #    rootProject = android/。放错一层不会报错，只是悄悄退回 debug 签名。
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/xiaozhi-release.keystore
          storePassword=$KS_STORE_PW
          keyPassword=$KS_KEY_PW
          keyAlias=$KS_ALIAS
          storeType=PKCS12
          EOF
          echo "keystore 就绪: $(stat -c%s app/xiaozhi-release.keystore) bytes"

      # 🔴 --flavor hyd 不能漏：漏了编出来的是 std（通用版），
      #    **没有内置商档**，而那正好是"构建全绿、版本对、签名对、就是不能用"。
      - name: Build 好又多版 APK (release)
        working-directory: scanner_app
        run: flutter build apk --release --flavor hyd

      # 断言 APK 里的版本 = pubspec 写的版本。判据与理由照抄 Android 主客户端那步
      # （aapt2 读真实打进包的 versionName/versionCode，别去 grep APK 字节流）。
      - name: 断言 APK 版本 = pubspec 版本
        working-directory: scanner_app
        run: |
          set -uo pipefail
          set +e
          # 带 flavor 时产物叫 app-hyd-release.apk；先按 hyd 找，找不到再退回通配。
          APK=$(ls build/app/outputs/flutter-apk/*hyd*.apk 2>/dev/null | head -1) || true
          [ -n "$APK" ] || APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1) || true
          echo "APK: '${APK:-<没找到>}'"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi
          # 🔴 顺手确认拿到的确实是 hyd 产物：文件名/路径里要带 hyd。
          #    拿到 std 的包而后面所有断言都过，是最难发现的一种交付事故。
          case "$APK" in
            *hyd*) echo "✅ 是 hyd 产物" ;;
            *) echo "::error::拿到的不是 hyd flavor 产物：$APK"; exit 1 ;;
          esac

          WANT=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '\r')
          echo "pubspec 里写的: '$WANT'"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT2=$(find "${SDK:-/nonexistent}/build-tools" -maxdepth 2 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$AAPT2" ]; then
            AAPT2=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'aapt2' 2>/dev/null | sort -V | tail -1) || true
          fi
          if [ -z "$AAPT2" ]; then
            echo "::error::找不到 aapt2 —— 读不出 APK 的真实版本，拒绝放行"
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK" 2>&1 || true)
          printf '%s\n' "$BADGING" | head -5
          GOT_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1) || true
          GOT_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1) || true
          # applicationId 必须带 .hyd 后缀 —— 它是"好又多版能与通用版共存"的关键，
          # 不带就说明 flavor 根本没生效。
          GOT_PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1) || true
          NAME=${WANT%%+*}
          CODE=${WANT##*+}
          echo "pubspec 拆开后 → name='$NAME' code='$CODE'"
          echo "APK 里实际的   → name='${GOT_NAME:-<解析不出来>}' code='${GOT_CODE:-<解析不出来>}'"
          echo "applicationId   → '${GOT_PKG:-<解析不出来>}'"
          if [ "$NAME" != "$GOT_NAME" ] || [ "$CODE" != "$GOT_CODE" ]; then
            echo "::error::APK 的版本号/构建号与 pubspec 的 '$WANT' 不一致 —— 拒绝交付"
            exit 1
          fi
          case "$GOT_PKG" in
            *.hyd) echo "✅ applicationId 带 .hyd：与通用版可共存" ;;
            *) echo "::error::applicationId 不带 .hyd 后缀（得到 '$GOT_PKG'）—— flavor 没生效"; exit 1 ;;
          esac
          echo "✅ APK 版本与 pubspec 一致：$NAME+$CODE"

      # 🔴🔴 这一步是**本次新增 job 的核心断言**，没有它整个 job 等于白做
      #
      # 断言"APK 里真的有那份 6.97MB 的商档"。
      #
      # 为什么非做不可（这正是 hyd 版的全部价值所在）：
      #   商档放在 `android/app/src/hyd/assets/`，由 build.gradle.kts 的
      #   sourceSets 挂进 APK。而**放错目录 gradle 不报错也不打包**
      #   （scanner_app/tools/build_builtin_master.py 顶部原话：
      #    "放错一层的话 gradle 不报错、静默不打包 —— 2026-09-19 就踩了这个：
      #     APK 只大了 16KB，核验才发现档案根本没进包"）。
      #   也就是说：构建成功 ✅ 版本对 ✅ 签名对 ✅ 唯独没有档案 ——
      #   前面所有断言一个都不会红，红的是客户在门店里扫码时。
      #
      # 为什么不能只比体积：APK 里没这个文件时，用"包比平时大 5MB"来判
      # 会被别的东西骗（混淆、资源、so 体积波动）。**直接解包看文件在不在**，
      # 唯一且可靠。
      - name: 断言 APK 里含内置商档
        working-directory: scanner_app
        shell: bash
        run: |
          set -uo pipefail
          set +e
          APK=$(ls build/app/outputs/flutter-apk/*hyd*.apk 2>/dev/null | head -1) || true
          if [ -z "$APK" ]; then
            echo "::error::没有 hyd APK 产物"
            exit 1
          fi

          # aapt2 dump badging 不列 assets 条目，这里直接解 zip 的中央目录读。
          # unzip -l 不解压内容，读 6.9MB 的条目也只是查目录，很快。
          ENTRIES=$(unzip -l "$APK" 2>/dev/null | grep -i "builtin_master.csv" || true)
          if [ -z "$ENTRIES" ]; then
            echo "::error::APK 里找不到 builtin_master.csv —— 这是个哑包（能装能扫、但没商品档案）"
            echo "  排查方向：① gradle sourceSets 挂的目录对不对"
            echo "           ② 商档是否被 .gitignore 排除（它就是被排除的，只能靠下载那步放进来）"
            echo "           ③ flavor 是不是漏了 --flavor hyd"
            echo "--- APK 内 assets 前 20 条（看看到底打进了什么）---"
            unzip -l "$APK" 2>/dev/null | awk '{print $4}' | grep -i '^assets/' | head -20
            exit 1
          fi
          echo "$ENTRIES"

          # 条目在，但体积要够 —— 防"文件在、内容空"（下载中断/传了表头）。
          BYTES=$(printf '%s\n' "$ENTRIES" | head -1 | awk '{print $1}')
          echo "APK 内该条目大小: ${BYTES:-<解析不出来>} 字节"
          echo "下限:            $MIN_HYD_MASTER_BYTES 字节"
          if [ -z "$BYTES" ] || [ "$BYTES" -lt "$MIN_HYD_MASTER_BYTES" ]; then
            echo "::error::APK 里的商档只有 ${BYTES:-?} 字节，小于下限 $MIN_HYD_MASTER_BYTES —— 内容不完整"
            exit 1
          fi
          echo "✅ APK 内含完整内置商档（$BYTES 字节）—— 不是哑包"

      - name: Verify APK signing cert (断言签名证书)
        working-directory: scanner_app
        run: |
          set -uo pipefail
          set +e
          APK=$(ls build/app/outputs/flutter-apk/*hyd*.apk 2>/dev/null | head -1) || true
          echo "APK: ${APK:-<没找到>}"
          if [ -z "$APK" ]; then
            echo "::error::没有 APK 产物"
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=""
          if [ -n "$SDK" ]; then
            APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name 'apksigner*' 2>/dev/null | sort -V | tail -1) || true
          fi
          [ -n "$APKSIGNER" ] || APKSIGNER=$(command -v apksigner 2>/dev/null || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/local/lib/android /opt /home/runner -maxdepth 6 -type f -name 'apksigner' 2>/dev/null | sort -V | tail -1) || true
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner —— 无法断言签名，拒绝放行"
            ls -1 "${SDK:-<空>}/build-tools" 2>&1 | head -20
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          printf '%s\n' "$RAW" | head -20
          # 只锚 'certificate SHA-256 digest'：build-tools 37 打成 `V2 Signer:`，
          # 旧版是 `Signer #1 certificate ...`，锚死前缀会一条都匹配不到。
          DIGEST=$(printf '%s\n' "$RAW" \
            | grep -F 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' \
            | tr -d ':' | tr 'A-Z' 'a-z') || true
          if [ -z "$DIGEST" ]; then
            echo "::error::解析不出签名指纹（APK 可能没签名，或输出格式变了）"
            exit 1
          fi
          echo "实际 SHA-256: $DIGEST"
          echo "期望 SHA-256: $EXPECT_APK_SHA256"
          if [ "$DIGEST" != "$EXPECT_APK_SHA256" ]; then
            echo "::error::签名指纹与已交付版本不一致 —— 这版装不到旧版上（报 -7），不许交付"
            exit 1
          fi
          echo "✅ 签名断言通过：与已交付版本同源，可覆盖安装"
          exit 0

      # 见 Android 主客户端那边的长注释（500MB 配额 vs Release 附件）。
      - name: Publish 好又多版 APK to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          # 文件名由机器拼上版本号，不留给人手写（手滑写成上一版名字，
          # 一个长得完全正常的包就装着旧版本）。
          WANT=$(sed -n 's/^version:[[:space:]]*//p' scanner_app/pubspec.yaml | head -1 | tr -d '\r')
          OUTDIR="scanner_app/build/app/outputs/flutter-apk"
          SRC=$(ls "$OUTDIR"/*hyd*.apk 2>/dev/null | head -1) || true
          if [ -z "$SRC" ]; then
            echo "::error::没有 hyd 产物可发布"
            exit 1
          fi
          OUT="${OUTDIR}/xiaozhi-scanner-hyd-Android-${WANT}.apk"
          cp "$SRC" "$OUT"
          echo "发布文件名: $(basename "$OUT")"
          echo "发布文件 sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: flutter build windows --release --dart-define=BASE_URL=${{ env.BASE_URL }} --dart-define=WAN_URL=${{ env.WAN_URL }}

      # 一个目录没法直接当附件传，先压成一个 zip（Release 附件只收文件）。
      - name: Zip Windows release dir
        shell: pwsh
        run: >
          Compress-Archive -Force
          -Path ${env:CLIENT_DIR}/build/windows/x64/runner/Release/*
          -DestinationPath xiaozhi-im-windows-exe.zip

      # 见 Android 那边 Publish 步骤上的长注释（配额 vs Release 附件）。
      - name: Publish EXE zip to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" \
                 --title "CI 最新产物（滚动，勿直接分发）" \
                 --notes "每次 push 到 main 覆盖同名附件。这里是流水线中间产物；正式安装包另行交付。" \
                 --prerelease || true
          # 同 Android 那侧：文件名由机器拼上版本号，不留给人手写。
          # Windows 侧没有 aapt2 可问版本（exe 的版本资源要读 PE），所以这里
          # **不假装验版本** —— 只保证"名字里那个版本是 pubspec 的，不是我敲的"。
          WANT=$(sed -n 's/^version:[[:space:]]*//p' "${CLIENT_DIR}/pubspec.yaml" | head -1 | tr -d '\r')
          OUT="xiaozhi-im-windows-${WANT}.zip"
          mv xiaozhi-im-windows-exe.zip "$OUT"
          echo "发布文件名: $OUT"
          echo "发布文件 sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          gh release upload "$ROLLING_TAG" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

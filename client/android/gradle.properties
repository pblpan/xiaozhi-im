org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ⚠️ 关掉 Kotlin 增量编译（Windows 上会随机炸，别手贱打开）
#
# 现象：`:record_android:compileReleaseKotlin` 报
#   "Could not close incremental caches ... : class-fq-name-to-source.tab,
#    source-to-classes.tab, internal-name-to-source.tab"
# 且**删掉整个 build/ 目录也会复现** —— 说明不是缓存陈旧，是这个包
# （record_android，由 record 插件带入）的增量编译在 Windows 上写缓存时
# 文件句柄没释放。Kotlin 2.4.0 + Flutter 模板的 android.builtInKotlin=false
# 组合下尤其容易触发。
#
# 代价：Kotlin 部分全量编译，每次构建慢一点（实测仍在 3 分钟内）。
# 收益：不再随机失败。**排查别再从"清缓存"入手，直接看这两行在不在。**
kotlin.incremental=false
kotlin.incremental.android=false

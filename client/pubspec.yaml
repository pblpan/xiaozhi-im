name: xiaozhi_im_client
description: 小智 IM 客户端 (Windows + Android)
publish_to: 'none'
version: 0.9.1+26

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  file_picker: ^12.2.0
  image: ^4.2.0
  intl: ^0.19.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  ffi: ^2.2.0
  flutter_webrtc: ^1.6.2+hotfix.1
  # Windows 键鼠注入（远程协助「被控端」用）。纯 Dart FFI 绑定 Win32 API，
  # 不需要写 C++ 插件。Android 侧不走这条路 —— 那边是无障碍服务。
  # ⚠️ 版本不能低于 6.3.0：file_picker/url_launcher 那条依赖链强制要求，
  #    写 ^5.x 会导致 pub get 直接解不出来。
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # 提示音：消息音 / 来电铃声 / 呼出回铃（由 tools/gen_sounds.py 合成）
    - assets/sounds/

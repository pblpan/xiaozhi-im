services:
  xiaozhi-im:
    image: xiaozhi-im-server:0.1.0
    container_name: xiaozhi-im
    restart: unless-stopped
    ports:
      - "3602:3602"
    environment:
      - PORT=3602
      - JWT_SECRET=${JWT_SECRET:-change-me-xiaozhi-im}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MAX_FILE_MB=50
      # 中继地址下发给客户端（改了不用重发安装包）
      - ICE_STUN=${ICE_STUN:-}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_USERNAME=${TURN_USER:-xiaozhi}
      # ⚠️ 安全：这里的默认口令是**公开仓库里可见的弱口令**，且必须与
      #    服务端 /data/turn.env 的 TURN_CREDENTIAL 完全一致，否则自建中继认证失败。
      #    生产环境请在 docker/.env 里显式覆盖 TURN_PASSWORD（并同步改 turn.env），
      #    不要依赖这个默认值。改了要重建 coturn 容器才生效。
      - TURN_CREDENTIAL=${TURN_PASSWORD:-xiaozhi-turn-2026}
      # Cloudflare Realtime TURN：免端口映射，免费额度 1TB/月
      - CF_TURN_KEY_ID=${CF_TURN_KEY_ID:-}
      - CF_TURN_API_TOKEN=${CF_TURN_API_TOKEN:-}
    volumes:
      - ./data:/data

  # ---------------------------------------------------------------
  #  TURN 中继：让手机流量 / 企业网络（对称 NAT）也能接通音视频。
  #
  #  用 host 网络是刻意的：中继要占一段 UDP 端口（默认 49160-49200），
  #  桥接模式得逐个映射，不如直接听宿主机。
  #
  #  ⚠ 前置条件（缺一不可）：
  #    1) 本机有公网 IP（在路由器 WAN 口能看到真实公网地址）
  #    2) 路由器把这些端口映射到本机：
  #         3478/udp  3478/tcp  49160-49200/udp
  #  没有公网 IP 的话，这个容器起得来也没用，外网仍打不通 —— 此时
  #  应改用云服务器跑中继，把 TURN_URLS 指过去。
  # ---------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: xiaozhi-im-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
      # 内网地址：留空则由 entrypoint 自动探测。写上后 coturn 用
      # "公网/内网" 双地址形式，两路都走本中继时直接在内部投递，不绕公网回环
      - TURN_INTERNAL_IP=${TURN_INTERNAL_IP:-}
      - TURN_USER=${TURN_USER:-xiaozhi}
      # ⚠️ 同上：公开可见的默认口令，生产请在 docker/.env 里覆盖 TURN_PASSWORD
      - TURN_PASSWORD=${TURN_PASSWORD:-xiaozhi-turn-2026}
      - TURN_REALM=${TURN_REALM:-xiaozhi.im}
      - TURN_MIN_PORT=${TURN_MIN_PORT:-49160}
      - TURN_MAX_PORT=${TURN_MAX_PORT:-49200}

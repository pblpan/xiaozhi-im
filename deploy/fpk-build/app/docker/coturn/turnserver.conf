# ============================================================
#  小智IM TURN 中继（coturn）配置模板
#
#  下面带 __XX__ 的占位符会在容器启动时由 entrypoint.sh 按环境变量替换，
#  所以这个文件本身不用改，改 docker-compose 里的环境变量即可。
#
#  为什么需要它：WebRTC 优先走 P2P，但手机流量（运营商大内网）和企业网络
#  基本都是对称 NAT，打洞必失败。没有中继，这类用户永远打不通通话。
# ============================================================

# ---- 监听 ----
listening-port=3478
listening-ip=0.0.0.0
# 容器用 host 网络，直接听宿主机的 UDP/TCP 3478

# ---- 中继地址端口范围 ----
# 刻意收窄：家用路由器映射 1.6 万个 UDP 端口（49152-65535）不现实。
# 41 个端口 ≈ 20 路并发通话，家用绰绰有余。
min-port=__MIN_PORT__
max-port=__MAX_PORT__

# ---- 对外地址 ----
# 关键项：NAT 后面必须告诉 coturn「我的公网地址是什么」，
# 否则它会把自己的内网地址（192.168.31.44）塞进 ICE 候选，客户端根本连不上。
# 由 entrypoint.sh 自动探测写入；家宽是动态 IP，写死了过几天就失效。
#
# 写法支持「公网/内网」双地址，例如 1.2.3.4/192.168.31.44：
# 这样两路通话都走本中继时，coturn 认出对方候选就是自己的公网地址，
# 直接在内网侧投递，不再出去打一圈 NAT 回环（家用路由器基本不支持回环）。
external-ip=__EXTERNAL_IP__

# ---- 认证（长期凭证）----
lt-cred-mech
realm=__REALM__
user=__TURN_USER__:__TURN_PASSWORD__

# ---- 安全与精简 ----
# fingerprint 是 WebRTC 客户端互操作的必需项
fingerprint
no-multicast-peers
no-cli
# 不开放 5349 TLS / DTLS：省证书、省端口，当前场景用不上
no-tls
no-dtls
stale-nonce=600

# ---- 配额 ----
# 单用户总量与单会话带宽上限，防止有人拿它当中转代理跑大流量
max-bps=1000000
user-quota=12
total-quota=100

# ---- 日志 ----
log-file=stdout
simple-log

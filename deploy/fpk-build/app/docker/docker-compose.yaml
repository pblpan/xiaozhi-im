name: xiaozhi-im

services:
  xiaozhi-im:
    image: node:22-slim
    container_name: xiaozhi-im
    restart: unless-stopped
    ports:
      - "3602:3602"
    environment:
      - PORT=3602
      - NODE_ENV=production
      # 数据落在飞牛自动创建的共享目录（config/resource 的 data-share 声明）
      - DATA_DIR=/data
      - DB_PATH=/data/xiaozhi-im.db
      # 密钥不留默认值（2026-09-16 整改）：安装脚本写进 .env，缺失时服务端生成随机值。
      # 从前这里是 xiaozhi-im-change-me-secret / admin123 —— 仓库公开期间等于全部泄漏。
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MAX_FILE_MB=${MAX_FILE_MB:-50}
      # 中继地址下发给客户端：改了不用重发客户端包
      - TURN_URLS=${TURN_URLS:-}
      - TURN_USERNAME=${TURN_USER:-xiaozhi}
      # 中继口令**只在 .env 里给**，这里不再兜底默认值 —— 本仓库是 Public，
      # 写在这里等于公开送人。安装脚本首次安装生成强随机口令、升级复用；
      # 万一真的缺了，coturn 的 entrypoint 会拒绝启动并明确告诉你补哪一行。
      - TURN_CREDENTIAL=${TURN_PASSWORD:-}
      # Cloudflare Realtime TURN：只走出站、走 443/TLS，不需要任何端口映射，
      # 免费额度 1TB/月。家宽没有公网 IP 时的首选通路。
      # 凭据由服务端现签现发（GET /api/call/ice），客户端无需任何改动。
      # 两个都留空则自动跳过，不影响启动。
      - CF_TURN_KEY_ID=${CF_TURN_KEY_ID:-}
      - CF_TURN_API_TOKEN=${CF_TURN_API_TOKEN:-}
    volumes:
      # 1) 持久化数据（DB + 上传文件），路径由 install_init 写入 docker/.env
      #    :-默认值兜底：万一 .env 没写好也不会让 fnOS compose 报 "invalid spec"
      - ${XIAOZHI_DATA_DIR:-/vol1/@appshare/xiaozhi-im/data}:/data
      # 2) 应用代码：fpk 解包到 TRIM_APPDEST 后挂载 src 进容器（含预打包 node_modules.tar.gz）
      - ${TRIM_APPDEST:-.}/src:/app
      # 3) 宿主机标识（只读）—— 授权机器码的指纹来源，**不要删**。
      #    容器里的东西都不能当指纹：hostname 是容器 ID（每次重建都变）、
      #    /etc/machine-id 根本不存在（Docker 默认不挂载）、网卡是虚拟的。
      #    用它们的话，重建一次容器（升级、热更、改配置都会触发）机器码就变了，
      #    已激活的授权当场失效。挂上之后：容器重建 → 码不变；
      #    换台机器 → 码必变（防把数据目录整个拷走白嫖）。
      - /etc/machine-id:/host/machine-id:ro
    working_dir: /app
    # 惰性解压依赖：仅当 node_modules 不存在时解压一次，之后可反复重启不丢依赖
    command: sh -c "cd /app && ([ -d node_modules ] || tar xzf node_modules.tar.gz) && node src/index.js"

  # ---------------------------------------------------------------
  #  TURN 中继：让手机流量 / 企业网络（对称 NAT）也能接通音视频。
  #
  #  用 host 网络是刻意的：中继要占一段 UDP 端口（49160-49200），
  #  桥接模式得逐个映射，不如直接听宿主机。
  #
  #  公网入口有三种打法（任选其一，也可都用）：
  #   A) 家宽有公网 IP：路由器映射 3478/udp、3478/tcp、49160-49200/udp
  #   B) 支持 TCP/UDP 的隧道服务，把上面这些端口逐条映射出去，
  #      公网端口号尽量与内网保持一致（ZeroNews 免费版不支持 TCP/UDP，要付费档）
  #   C) 干脆不用这个容器：在上面 xiaozhi-im 服务里填 CF_TURN_KEY_ID /
  #      CF_TURN_API_TOKEN，走 Cloudflare 的托管中继（免端口映射）
  #  都没配的话，这个容器起来了也接不到外网 —— 但内网通话不受影响。
  # ---------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: xiaozhi-im-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${TRIM_APPDEST:-.}/docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ${TRIM_APPDEST:-.}/docker/coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
      # 内网地址：留空则由 entrypoint 自动探测。写上后 coturn 用
      # "公网/内网" 双地址形式，两路都走本中继时直接在内部投递，不绕公网回环
      - TURN_INTERNAL_IP=${TURN_INTERNAL_IP:-}
      - TURN_USER=${TURN_USER:-xiaozhi}
      # 同服务端：口令只在 .env 里给（安装脚本生成）。留空时 entrypoint 会
      # 直接报错退出，不会带着空口令或公开默认口令把中继跑起来。
      - TURN_PASSWORD=${TURN_PASSWORD:-}
      - TURN_REALM=${TURN_REALM:-xiaozhi.im}
      - TURN_MIN_PORT=${TURN_MIN_PORT:-49160}
      - TURN_MAX_PORT=${TURN_MAX_PORT:-49200}

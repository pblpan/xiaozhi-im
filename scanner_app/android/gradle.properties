org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ⚠️ 关掉 Kotlin 增量编译（Windows 上会随机炸，别手贱打开）
#
# 现象：`:xxx:compileReleaseKotlin` 报
#   "Could not close incremental caches ... : class-fq-name-to-source.tab,
#    source-to-classes.tab, internal-name-to-source.tab"
# 且**删掉整个 build/ 目录也会复现** —— 说明不是缓存陈旧，是增量编译在
# Windows 上写缓存时文件句柄没释放。主 App（xiaozhi-im/client）那边踩过
# 一模一样的坑（`record_android` 插件触发），这里照抄结论。
#
# 代价：Kotlin 部分全量编译，每次构建慢一点。收益：不再随机失败。
kotlin.incremental=false
kotlin.incremental.android=false
